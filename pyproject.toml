[project]
name = "yourshot"
version = "0.1.0"
description = "YourShot DJ & Audio DSP Toolkit"
readme = "README.md"
authors = [
    { name = "Niraj Amalkanti", email = "namalkanti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "google-genai>=2.30.0",
    "marimo>=0.25.1",
    "matplotlib>=3.11.2",
    "mutagen>=1.48.1",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "pydantic-ai-slim>=2.55.0",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yourshot"]

